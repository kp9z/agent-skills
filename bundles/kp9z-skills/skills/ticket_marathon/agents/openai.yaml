interface:
  display_name: "Ticket Marathon"
  short_description: "Delegate three tickets, then resume after 4h 30m"
  default_prompt: "Use $ticket_marathon as an orchestrator only: delegate each dependency-ready ticket to a new chat, wait for its result before the next, process up to three per batch, and schedule each continuation 4 hours 30 minutes after the batch finishes until the queue is empty."
policy:
  allow_implicit_invocation: false
