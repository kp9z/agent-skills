interface:
  display_name: "Ticket Marathon"
  short_description: "Implement three tickets, then resume after 4h 30m"
  default_prompt: "Use $ticket_marathon to implement dependency-ready tickets one at a time, three per batch, and schedule each continuation 4 hours 30 minutes after the batch finishes until the queue is empty."
policy:
  allow_implicit_invocation: false
